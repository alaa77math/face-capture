<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام بصمة9999 الوجه الذكي</title>
  
  <!-- استدعاء مكتبة تتبع الوجوه الخفيفة والمستقرة جداً والمقاومة للحظر الأمني -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    
    /* حاوية الكاميرا لضبط المربع الأخضر بدقة فوق الوجه */
    .camera-container { position: relative; width: 100%; max-width: 400px; margin: 15px auto 0 auto; }
    video { border: 3px solid #ccc; border-radius: 8px; width: 100%; background: #000; transform: scaleX(-1); }
    canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
    
    /* نمط الزر وهو مجمد (رمادي لا يضغط) */
    .btn { padding: 12px 24px; font-size: 16px; background-color: #cccccc; color: #666; border: none; border-radius: 5px; cursor: not-allowed; font-weight: bold; width: 100%; margin-top: 15px; transition: all 0.3s; }
    /* نمط الزر وهو نشط (أخضر يعمل) */
    .btn.active { background-color: #28a745; color: white; cursor: pointer; }
    
    #status { margin-top: 15px; font-weight: bold; color: #cc3300; }
    .result-box { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; display: none; }
    #resultImage { border: 3px solid #28a745; border-radius: 8px; width: 100%; max-width: 320px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>نظام بصمة الوجه بالذكاء الاصطناعي</h2>
    <p>لن يتم تفعيل زر الالتقاط إلا عند رصد وجه بشري حقيقي</p>
    
    <div class="input-group">
      <label for="userName">الاسم الكامل للمستخدم:</label>
      <input type="text" id="id_userName" class="input-field" placeholder="اكتب الاسم الكامل هنا...">
    </div>
    
    <div class="camera-container">
      <video id="id_video" width="400" height="300" preload autoplay loop muted></video>
      <canvas id="id_overlay" class="overlay" width="400" height="300"></canvas>
    </div>
    
    <button class="btn" id="id_snapBtn" disabled>في انتظار رصد وجه حقيقي...</button>
    <canvas id="id_hiddenCanvas" style="display:none;"></canvas>
    <div id="status">جاري تشغيل محرك تتبع الوجوه...</div>

    <div class="result-box" id="id_resultBox">
      <h3>اللقطة الحالية المرفوعة:</h3>
      <img id="id_resultImage" src="" alt="بصمة الوجه">
    </div>
  </div>

  <script>
    // ⚠️ ضع رابط تطبيق ويب Google Apps Script الخاص بك هنا بين علامتي التنصيص:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm6Qs1D3vXJbvmzDM3-7z_kQnUvYvbQIh-oZ6ZIt6KwFeWzskt8EveSeAU2tnMY3meuw/exec";  

    const video = document.getElementById('id_video');
    const overlay = document.getElementById('id_overlay');
    const hiddenCanvas = document.getElementById('id_hiddenCanvas');
    const snapBtn = document.getElementById('id_snapBtn');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('id_resultBox');
    const resultImage = document.getElementById('id_resultImage');
    const userNameInput = document.getElementById('id_userName');
    let streamInstance = null;
    let trackerTask = null;

    window.addEventListener('load', async () => {
      try {
        // تشغيل الكاميرا المباشرة أولاً بامتيازات المتصفح المباشرة
        streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 400, height: 300 } });
        video.srcObject = streamInstance;
        
        statusDiv.innerHTML = "تم تشغيل الكاميرا. جاري بدء نظام تتبع الملامح...";
        statusDiv.style.color = "#333";

        // إعداد محرك تتبع الوجوه (Object Tracker) المخصص للوجوه
        const tracker = new tracking.ObjectTracker('face');
        tracker.setInitialScale(4);
        tracker.setStepSize(2);
        tracker.setEdgesDensity(0.1);

        // بدء تشغيل التتبع الحي فوق عنصر الفيديو
        trackerTask = tracking.track('#id_video', tracker);

        // الاستماع للأحداث عند اكتشاف أو رصد وجه
        tracker.on('track', function(event) {
          const context = overlay.getContext('2d');
          context.clearRect(0, 0, overlay.width, overlay.height);

          if (event.data.length === 0) {
            // الكاميرا مفتوحة ولكن لا يوجد وجه بشري واضح أمامها
            statusDiv.innerHTML = "❌ تنبيه: لم يتم اكتشاف وجه. يرجى التموضع جيداً أمام الكاميرا.";
            statusDiv.style.color = "#cc3300";
            
            // قفل الزر وتغيير حالته
            snapBtn.disabled = true;
            snapBtn.classList.remove('active');
            snapBtn.innerHTML = "في انتظار رصد وجه حقيقي...";
          } else {
            // تم العثور على وجه بشري حقيقي!
            statusDiv.innerHTML = "✅ تم رصد وجه حقيقي بنجاح! اكتب اسمك واضغط التقاط.";
            statusDiv.style.color = "green";
            
            // تفعيل وتنشيط زر الحفظ والالتقاط
            snapBtn.disabled = false;
            snapBtn.classList.add('active');
            snapBtn.innerHTML = "إلتقاط وحفظ بصمة الوجه المعتمدة";

            // رسم المربع الأخضر التلقائي حول الأماكن المكتشفة للوجه في البث الحي
            event.data.forEach(function(rect) {
              context.strokeStyle = '#28a745'; // لون أخضر
              context.lineWidth = 4;
              context.strokeRect(rect.x, rect.y, rect.width, rect.height);
            });
          }
        });

      } catch (err) {
        statusDiv.innerHTML = "خطأ في تشغيل النظام: " + err.message;
        statusDiv.style.color = "red";
      }
    });

    snapBtn.addEventListener('click', () => {
      const nameValue = userNameInput.value.trim();
      if (!nameValue) {
        alert("يرجى كتابة الاسم الكامل للمستخدم أولاً قبل التقاط الصورة!");
        userNameInput.focus();
        return;
      }
      
      // إيقاف التتبع الفوري لحفظ الموارد وثبات شاشة العرض
      if(trackerTask) trackerTask.stop();
      
      statusDiv.innerHTML = "جاري التقاط ومعالجة لقطة الوجه الذكية...";
      statusDiv.style.color = "#0066cc";
      
      const context = hiddenCanvas.getContext('2d');
      hiddenCanvas.width = 400;
      hiddenCanvas.height = 300;
      
      context.translate(hiddenCanvas.width, 0);
      context.scale(-1, 1);
      context.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
      
      const dataUrl = hiddenCanvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      resultBox.style.display = "block";
      overlay.style.display = "none";
      
      statusDiv.innerHTML = "جاري ترحيل ورفع الصورة باسم: (" + nameValue + ") إلى الـ Drive...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        body: JSON.stringify({
          imageFile: dataUrl,
          name: nameValue
        })
      })
      .then(() => {
        statusDiv.innerHTML = "🎉 تمت العملية بنجاح! تم التحقق أوتوماتيكياً من الوجه وحفظ الملف بالاسم.";
        statusDiv.style.color = "green";
        if (streamInstance) {
          streamInstance.getTracks().forEach(track => track.stop());
        }
      })
      .catch(err => {
        statusDiv.innerHTML = "خطأ في الاتصال بالخادم: " + err.message;
        statusDiv.style.color = "red";
      });
    });
  </script>
</body>
</html>
