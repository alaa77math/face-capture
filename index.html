<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام التقاط بصمة الوجه المباشر</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    video { border: 3px solid #28a745; border-radius: 8px; width: 100%; background: #000; transform: scaleX(-1); }
    .btn { padding: 12px 24px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
    .btn-capture { background-color: #dc3545; }
    #status { margin-top: 20px; font-weight: bold; color: #0066cc; }
  </style>
</head>
<body>

  <div class="container">
    <h2>بث الكاميرا الحي المستقل</h2>
    <p>بث مباشر آمن لتخزين بصمة الوجه في المجلد المخصص</p>
    
    <video id="video" autoplay playsinline></video>
    <button class="btn btn-capture" id="snapBtn">إلتقاط وإرسال الصورة ععععععععععععع</button>
    
    <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>
    <div id="status">جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    // ⚠️ ضع رابط تطبيق ويب Google Apps Script الخاص بك هنا بين علامتي التنصيص:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm6Qs1D3vXJbvmzDM3-7z_kQnUvYvbQIh-oZ6ZIt6KwFeWzskt8EveSeAU2tnMY3meuw/exec"; 

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snapBtn');
    const statusDiv = document.getElementById('status');
    let streamInstance = null;

    // تشغيل الكاميرا المباشرة
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => {
        streamInstance = stream;
        video.srcObject = stream;
        statusDiv.innerHTML = "الكاميرا تعمل بنجاح. اضبط وجهك ثم اضغط التقاط.";
      })
      .catch(err => {
        statusDiv.innerHTML = "خطأ في الكاميرا: " + err.message;
      });

    // التقاط الصورة وإرسالها
    snapBtn.addEventListener('click', () => {
      if (!streamInstance) return;
      
      statusDiv.innerHTML = "جاري معالجة اللقطة...";
      const context = canvas.getContext('2d');
      context.translate(canvas.width, 0);
      context.scale(-1, 1);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL('image/png');
      statusDiv.innerHTML = "جاري إرسال الصورة إلى المجلد الخاص بك في Google Drive...";

      // تحويل البيانات لشكل نموذج بسيط لتجاوز حظر الـ CORS تماماً
      const formData = new URLSearchParams();
      formData.append('image', dataUrl);

      // الإرسال بوضع no-cors المضمون لتخطي حظر المتصفحات
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      })
      .then(() => {
        statusDiv.innerHTML = "<span style='color:green;'>🎉 تمت العملية بنجاح! تم إرسال لقطة وجهك وحفظها في المجلد المخصص داخل Google Drive.</span>";
        // إيقاف الكاميرا بعد النجاح
        if (streamInstance) {
          streamInstance.getTracks().forEach(track => track.stop());
        }
      })
      .catch(err => {
        statusDiv.innerHTML = "حدث خطأ أثناء الإرسال: " + err.message;
      });
    });
  </script>
</body>
</html>
