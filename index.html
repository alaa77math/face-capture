<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام التقاط555555555 بصمة الوجه المطور</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    
    /* حاوية الكاميرا مقيدة دائرياً */
    .camera-container { position: relative; width: 300px; height: 300px; margin: 20px auto; border-radius: 50%; overflow: hidden; border: 4px solid #007bff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; transform: scaleX(-1); }
    
    /* قناع دائري تظليلي مرئي لإجبار الشخص على وضع وجهه في المركز */
    .circle-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 25px rgba(0, 0, 0, 0.5); pointer-events: none; }
    
    .btn { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: background 0.3s; }
    .btn:hover { background-color: #0056b3; }
    .result-box { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; display: none; }
    #resultImage { border: 3px solid #28a745; border-radius: 50%; width: 180px; height: 180px; object-fit: cover; margin-top: 10px; }
    #status { margin-top: 15px; font-weight: bold; color: #28a745; }
  </style>
</head>
<body>

  <div class="container">
    <h2>نظام بصمة الوجه المحدّد</h2>
    <p>اضبط تموضع ملامح وجهك داخل الدائرة الزرقاء تماماً واضغط التقاط</p>
    
    <div class="input-group">
      <label for="userName">الاسم الكامل للمستخدم:</label>
      <input type="text" id="id_userName" class="input-field" placeholder="اكتب الاسم الكامل هنا...">
    </div>
    
    <div class="camera-container">
      <video id="id_video" autoplay playsinline muted></video>
      <div class="circle-mask"></div>
    </div>
    
    <button class="btn" id="id_snapBtn">إلتقاط وقص منطقة الوجه حصراً</button>
    <canvas id="id_hiddenCanvas" style="display:none;"></canvas>
    <div id="status">جاري تشغيل الكاميرا المباشرة...</div>

    <div class="result-box" id="id_resultBox">
      <h3>البصمة المستقطعة التي تم رفعها للـ Drive:</h3>
      <img id="id_resultImage" src="" alt="بصمة الوجه">
    </div>
  </div>

  <script>
    // ⚠️ ضع رابط تطبيق ويب Google Apps Script الخاص بك هنا بين علامتي التنصيص:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm6Qs1D3vXJbvmzDM3-7z_kQnUvYvbQIh-oZ6ZIt6KwFeWzskt8EveSeAU2tnMY3meuw/exec"; 

    const video = document.getElementById('id_video');
    const hiddenCanvas = document.getElementById('id_hiddenCanvas');
    const snapBtn = document.getElementById('id_snapBtn');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('id_resultBox');
    const resultImage = document.getElementById('id_resultImage');
    const userNameInput = document.getElementById('id_userName');
    let streamInstance = null;

    window.addEventListener('load', async () => {
      try {
        // تشغيل الكاميرا بأبعاد مربعة قياسية
        streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 400, height: 400 } });
        video.srcObject = streamInstance;
        statusDiv.innerHTML = "الكاميرا تعمل بنجاح. اضبط ملامح وجهك داخل الدائرة ثم اكتب اسمك.";
        statusDiv.style.color = "green";
      } catch (err) {
        statusDiv.innerHTML = "خطأ في تفعيل الكاميرا: " + err.message;
        statusDiv.style.color = "red";
      }
    });

    snapBtn.addEventListener('click', () => {
      const nameValue = userNameInput.value.trim();
      if (!nameValue) {
        alert("يرجى كتابة الاسم الكامل للمستخدم أولاً قبل التقاط الصورة!");
        userNameInput.focus();
        return;
      }
      
      statusDiv.innerHTML = "جاري عزل وقص منطقة الوجه برمجياً...";
      statusDiv.style.color = "#0066cc";
      
      const context = hiddenCanvas.getContext('2d');
      
      // 💡 تحديد حجم مربع البصمة المستهدف (220 بكسل يركز بدقة على ملامح الوجه فقط)
      const targetSize = 220; 
      hiddenCanvas.width = targetSize;
      hiddenCanvas.height = targetSize;
      
      // حساب نقطة المنتصف الرياضية بناءً على الأبعاد الفعلية لتيار الفيديو المدخل
      const vWidth = video.videoWidth || 400;
      const vHeight = video.videoHeight || 400;
      const cropX = (vWidth - targetSize) / 2;
      const cropY = (vHeight - targetSize) / 2;
      
      // تفعيل مرآة العرض الأفقي لإنتاج بصمة وجه طبيعية الاتجاه
      context.translate(hiddenCanvas.width, 0);
      context.scale(-1, 1);
      
      // إجبار الكانفاس على قص الإحداثيات المركزية المحددة للوجه فقط وتجاهل الأطراف والخلفية
      context.drawImage(
        video, 
        cropX, cropY, targetSize, targetSize, // عزل منطقة الوجه الوسطى من شاشة الكاميرا الأصلية
        0, 0, targetSize, targetSize         // رسم الجزء المقصوص بمفرده داخل ملف الحفظ الجديد
      );
      
      const dataUrl = hiddenCanvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      resultBox.style.display = "block";
      
      statusDiv.innerHTML = "جاري ترحيل البصمة المقصوصة للـ Drive باسم: (" + nameValue + ")...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        body: JSON.stringify({
          imageFile: dataUrl,
          name: nameValue
        })
      })
      .then(() => {
        statusDiv.innerHTML = "🎉 تمت العملية بنجاح! تم عزل منطقة الوجه النظيفة وحفظها بالاسم داخل Google Drive.";
        statusDiv.style.color = "green";
        if (streamInstance) {
          streamInstance.getTracks().forEach(track => track.stop());
        }
      })
      .catch(err => {
        statusDiv.innerHTML = "خطأ في إرسال البيانات: " + err.message;
        statusDiv.style.color = "red";
      });
    });
  </script>
</body>
</html>
