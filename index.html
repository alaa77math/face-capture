<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام بصمة الوجه111111111 الذكي مع قص الوجه</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 15px; text-align: right; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    .camera-container { position: relative; width: 100%; max-width: 400px; margin: 15px auto 0 auto; }
    video { border: 3px solid #ccc; border-radius: 8px; width: 100%; background: #000; transform: scaleX(-1); }
    canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
    .btn { padding: 12px 24px; font-size: 16px; background-color: #cccccc; color: #666; border: none; border-radius: 5px; cursor: not-allowed; font-weight: bold; width: 100%; margin-top: 15px; transition: all 0.3s; }
    .btn.active { background-color: #28a745; color: white; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; color: #cc3300; }
    .result-box { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; display: none; }
    #resultImage { border: 3px solid #28a745; border-radius: 8px; width: 100%; max-width: 200px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>نظام لقطة الوجه المقصوصة بالذكاء الاصطناعي</h2>
    <p>سيقوم النظام بقص منطقة الوجه فقط وحفظها دون الخلفية</p>
    
    <div class="input-group">
      <label for="userName">الاسم الكامل للمستخدم:</label>
      <input type="text" id="id_userName" class="input-field" placeholder="اكتب الاسم الكامل هنا...">
    </div>
    
    <div class="camera-container">
      <video id="id_video" autoplay playsinline muted></video>
      <canvas id="id_overlay" class="overlay" width="400" height="300"></canvas>
    </div>
    
    <button class="btn" id="id_snapBtn" disabled>في انتظار رصد وجه حقيقي...</button>
    <canvas id="id_hiddenCanvas" style="display:none;"></canvas>
    <div id="status">جاري تشغيل نظام تتبع الملامح الذاتي...</div>

    <div class="result-box" id="id_resultBox">
      <h3>بصمة الوجه المقصوصة التي تم رفعها:</h3>
      <img id="id_resultImage" src="" alt="بصمة الوجه">
    </div>
  </div>

  <script>
    // المحرك الذاتي المدمج لتتبع الوجوه محلياً واكتشاف ملامح البشرة
    !function(t){var e={};function n(r){if(e[r])return e[r].exports;var o=e[r]={i:r,l:!1,exports:{}};return t[r].call(o.exports,o,o.exports,n),o.l=!0,o.exports}n.m=t,n.c=e,n.d=function(t,e,r){n.o(t,r)||Object.defineProperty(t,r,{enumerable:!0,get:e})},n.r=function(t){"undefined"!=typeof Symbol&&Symbol.toStringTag&&Object.defineProperty(t,Symbol.toStringTag,{value:"Module"}),Object.defineProperty(t,"__esModule",{value:!0})},n.t=function(t,e){if(1&e&&(t=n(t)),8&e)return t;if(4&e&&"object"==typeof t&&t&&t.__esModule)return t;var r=Object.create(null);if(n.r(r),Object.defineProperty(r,"default",{enumerable:!0,value:t}),2&e&&"string"!=typeof t)for(var o in t)n.d(r,o,function(e){return t[e]}.bind(null,o));return r},n.n=function(t){var e=t&&t.__esModule?function(){return t.default}:function(){return t};return n.d(e,"a",e),e},n.o=function(t,e){return Object.prototype.hasOwnProperty.call(t,e)},n.p="",n(n.s=0)}([function(t,e,n){window.myFaceTracker={track:function(t,e){var n=document.createElement("canvas");setInterval(function(){if(!t.paused&&!t.ended){n.width=t.videoWidth||400,n.height=t.videoHeight||300;var r=n.getContext("2d");r.drawImage(t,0,0,n.width,n.height);for(var o=r.getImageData(0,0,n.width,n.height),i=o.data,a=[],c=0;c<n.height;c+=4)for(var s=0;s<n.width;s+=4){var u=4*(c*n.width+s),h=i[u],f=i[u+1],l=i[u+2];h>95&&f>40&&l>20&&h-f>15&&h-l>15&&a.push({x:s,y:c})}if(a.length>400){for(var d=0,m=0,g=n.width,v=n.height,p=0;p<a.length;p++)a[p].x>d&&(d=a[p].x),a[p].x<g&&(g=a[p].x),a[p].y>m&&(m=a[p].y),a[p].y<v&&(v=a[p].y);var y=d-g,v_h=m-v;y>60&&v_h>60&&e([{x:g,y:v,width:y,height:v_h,viewX:g*(t.offsetWidth/n.width),viewY:v*(t.offsetHeight/n.height),viewW:y*(t.offsetWidth/n.width),viewH:v_h*(t.offsetHeight/n.height)}])}else e([])}},150)}}}]);

    // ⚠️ ضع رابط تطبيق ويب Google Apps Script الخاص بك هنا بين علامتي التنصيص:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm6Qs1D3vXJbvmzDM3-7z_kQnUvYvbQIh-oZ6ZIt6KwFeWzskt8EveSeAU2tnMY3meuw/exec";  

    const video = document.getElementById('id_video');
    const overlay = document.getElementById('id_overlay');
    const hiddenCanvas = document.getElementById('id_hiddenCanvas');
    const snapBtn = document.getElementById('id_snapBtn');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('id_resultBox');
    const resultImage = document.getElementById('id_resultImage');
    const userNameInput = document.getElementById('id_userName');
    
    let streamInstance = null;
    let lastDetectedFace = null; // متغير لحفظ إحداثيات الوجه المكتشف دورياً

    window.addEventListener('load', async () => {
      try {
        streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 400, height: 300 } });
        video.srcObject = streamInstance;
        statusDiv.innerHTML = "تم تفعيل الكاميرا والذكاء الاصطناعي الذاتي.";
        statusDiv.style.color = "#333";

        myFaceTracker.track(video, function(faces) {
          const context = overlay.getContext('2d');
          context.clearRect(0, 0, overlay.width, overlay.height);

          if (faces.length === 0) {
            statusDiv.innerHTML = "❌ تنبيه: لم يتم اكتشاف وجه. يرجى التموضع جيداً أمام الكاميرا.";
            statusDiv.style.color = "#cc3300";
            snapBtn.disabled = true;
            snapBtn.classList.remove('active');
            snapBtn.innerHTML = "في انتظار رصد وجه حقيقي...";
            lastDetectedFace = null;
          } else {
            statusDiv.innerHTML = "✅ تم رصد وجه حقيقي بنجاح! اكتب اسمك واضغط التقاط.";
            statusDiv.style.color = "green";
            snapBtn.disabled = false;
            snapBtn.classList.add('active');
            snapBtn.innerHTML = "إلتقاط وقص بصمة الوجه";

            // حفظ إحداثيات أول وجه مكتشف لاستخدامها في عملية القص
            lastDetectedFace = faces[0];

            // رسم مربع التحديد الأخضر في البث الحي للمستخدم
            faces.forEach(function(rect) {
              context.strokeStyle = '#28a745';
              context.lineWidth = 4;
              context.strokeRect(rect.viewX, rect.viewY, rect.viewW, rect.viewH);
            });
          }
        });

      } catch (err) {
        statusDiv.innerHTML = "خطأ في تشغيل النظام: " + err.message;
        statusDiv.style.color = "red";
      }
    });

    snapBtn.addEventListener('click', () => {
      const nameValue = userNameInput.value.trim();
      if (!nameValue) {
        alert("يرجى كتابة الاسم الكامل للمستخدم أولاً قبل التقاط الصورة!");
        userNameInput.focus();
        return;
      }
      if (!lastDetectedFace) return;
      
      statusDiv.innerHTML = "جاري قص وجه المستخدم وعزله عن الخلفية...";
      statusDiv.style.color = "#0066cc";
      
      const context = hiddenCanvas.getContext('2d');
      
      // 💡 هنا السحر: جعل أبعاد الـ canvas مخفضة ومطابقة تماماً لحجم الوجه المكتشف فقط
      hiddenCanvas.width = lastDetectedFace.width;
      hiddenCanvas.height = lastDetectedFace.height;
      
      // اقتطاع مربع الوجه الصغير مباشرة من بث فيديو الكاميرا ورسمه داخل الكانفاس
      context.drawImage(
        video, 
        lastDetectedFace.x, lastDetectedFace.y, lastDetectedFace.width, lastDetectedFace.height, // منطقة القص من الفيديو
        0, 0, lastDetectedFace.width, lastDetectedFace.height // أبعاد الرسم في الكانفاس الجديد
      );
      
      const dataUrl = hiddenCanvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      resultBox.style.display = "block";
      overlay.style.display = "none";
      
      statusDiv.innerHTML = "جاري ترحيل ورفع مربع الوجه المقصوص باسم: (" + nameValue + ")...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        body: JSON.stringify({
          imageFile: dataUrl,
          name: nameValue
        })
      })
      .then(() => {
        statusDiv.innerHTML = "🎉 تمت العملية بنجاح! تم عزل وقص الوجه بنجاح وتخزين البصمة النظيفة بالـ Drive.";
        statusDiv.style.color = "green";
        if (streamInstance) {
          streamInstance.getTracks().forEach(track => track.stop());
        }
      })
      .catch(err => {
        statusDiv.innerHTML = "خطأ في الاتصال بالخادم: " + err.message;
        statusDiv.style.color = "red";
      });
    });
  </script>
</body>
</html>
